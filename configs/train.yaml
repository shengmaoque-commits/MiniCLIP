experiment:
  name: miniclip_resnet18_v1
  seed: 42

dataset:
  root: data/Images
  image_dir: flickr30k_images
  captions_file: results.csv
  image_size: 224
  max_text_length: 40
  train_ratio: 0.90
  val_ratio: 0.05

model:
  vision_encoder: resnet18

  pretrained_vision: false

  image_feature_dim: 512

  embed_dim: 256

  temperature: 0.07

  text:
    hidden_dim: 512
    num_layers: 4
    num_heads: 8
    ff_dim: 2048
    dropout: 0.1

train:
  batch_size: 128

  epochs: 30

  lr: 0.0001

  weight_decay: 0.01

  num_workers: 8

  amp: true

  grad_clip: 1.0

  save_dir: checkpoints

eval:
  batch_size: 128